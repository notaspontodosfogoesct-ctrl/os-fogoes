<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Ordens de Serviço · Ponto dos Fogões</title>
<meta name="theme-color" content="#1C2126">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1C2126;
  --charcoal-2:#262D34;
  --paper:#F7F4EE;
  --paper-dim:#EDE9DF;
  --amber:#E8622C;
  --amber-dark:#C94F1F;
  --green:#2F6B4F;
  --green-bg:#E4EFE8;
  --red:#B23A34;
  --red-bg:#F5E4E2;
  --gray:#6B7280;
  --line:#D8D2C4;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--paper-dim);
  color:var(--charcoal);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* Header */
header.app-header{
  background:var(--charcoal);
  color:var(--paper);
  padding:16px 18px 14px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.app-header .brand{display:flex;align-items:center;justify-content:space-between;}
.app-header .brand-text h1{font-size:17px;font-weight:700;letter-spacing:.2px;}
.app-header .brand-text span{display:block;font-size:11.5px;color:#9BA3AC;margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,107,79,.25);}
.status-dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(178,58,52,.25);}
.pill-queue{
  font-size:11px;color:var(--amber);background:rgba(232,98,44,.15);
  padding:3px 9px;border-radius:20px;margin-left:8px;display:none;font-weight:600;
}
.tabs{display:flex;gap:6px;margin-top:14px;}
.tab-btn{
  flex:1;padding:10px 6px;border:none;border-radius:8px;background:var(--charcoal-2);
  color:#B8BFC7;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:.15s;
}
.tab-btn.active{background:var(--amber);color:#fff;}

main{max-width:640px;margin:0 auto;padding:16px 14px 90px;}
.view{display:none;}
.view.active{display:block;}

/* Ticket card */
.ticket{
  background:var(--paper);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  margin-bottom:14px;
  overflow:hidden;
}
.ticket-stub{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--charcoal);color:var(--paper);
  position:relative;
}
.ticket-stub::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:0;
  border-bottom:2px dashed rgba(247,244,238,.25);
}
.ticket-stub .os-num{font-size:26px;font-weight:600;letter-spacing:.5px;}
.ticket-stub .os-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9BA3AC;}
.ticket-body{padding:16px;}

/* Form elements */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-size:15px;font-family:'Inter',sans-serif;background:#fff;color:var(--charcoal);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
.field textarea{resize:vertical;min-height:44px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Item block */
.item-block{
  border:1.5px dashed var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:#FCFBF8;
}
.item-block .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.item-block .item-head span{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--amber-dark);}
.item-block .rm-item{background:none;border:none;color:var(--red);font-size:12px;font-weight:600;cursor:pointer;}
.garantia-toggle{display:flex;gap:8px;}
.garantia-toggle button{
  flex:1;padding:9px;border-radius:7px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;
}
.garantia-toggle button.sel-sim{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.garantia-toggle button.sel-nao{background:var(--red-bg);border-color:var(--red);color:var(--red);}

.btn-add-item{
  width:100%;padding:11px;border:1.5px dashed var(--amber);border-radius:8px;
  background:none;color:var(--amber-dark);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:16px;
}

/* Photos */
.photo-actions{display:flex;gap:10px;margin-bottom:10px;}
.photo-actions button{
  flex:1;padding:12px 8px;border-radius:8px;border:1.5px solid var(--charcoal);
  background:var(--charcoal);color:#fff;font-weight:600;font-size:13px;cursor:pointer;
}
.photo-actions button.secondary{background:#fff;color:var(--charcoal);}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;
}

/* Totals bar */
.totals{
  background:var(--charcoal-2);color:var(--paper);border-radius:8px;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
}
.totals .lbl{font-size:11px;color:#9BA3AC;text-transform:uppercase;letter-spacing:.4px;}
.totals .val{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}

.btn-primary{
  width:100%;padding:15px;border:none;border-radius:9px;background:var(--amber);
  color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;cursor:pointer;
}
.btn-primary:active{background:var(--amber-dark);}
.btn-primary:disabled{background:#C9C2B2;}

/* Search / list */
.search-bar{display:flex;gap:8px;margin-bottom:16px;}
.search-bar input{flex:1;}
.search-bar button{
  padding:0 18px;border:none;border-radius:8px;background:var(--charcoal);color:#fff;font-weight:600;cursor:pointer;
}
.result-card{
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:13px 14px;
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
}
.result-card:active{background:#EFEAE0;}
.result-left .os{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--amber-dark);}
.result-left .cli{font-weight:600;font-size:14.5px;margin-top:2px;}
.result-left .meta{font-size:12px;color:var(--gray);margin-top:2px;}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge.entregue{background:var(--green-bg);color:var(--green);}
.badge.pendente{background:var(--red-bg);color:var(--red);}
.badge.aberto{background:#EAE3F5;color:#6B4FA0;}
.badge.aguardando{background:#FDF0DA;color:#A6720C;}
.badge.execucao{background:#E3ECF7;color:#3A5F94;}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray);}
.empty-state .big{font-size:34px;margin-bottom:8px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(28,33,38,.55);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  background:var(--paper);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding-bottom:24px;
}
.modal-drag{width:38px;height:4px;background:var(--line);border-radius:3px;margin:10px auto;}
.modal-close{
  position:sticky;top:0;background:var(--paper);text-align:right;padding:0 16px;z-index:2;
}
.modal-close button{background:none;border:none;font-size:22px;color:var(--gray);cursor:pointer;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:30px;
  font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin:18px 0 10px;}
.hint{font-size:11.5px;color:var(--gray);margin-top:-8px;margin-bottom:14px;}

/* Dashboard */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.stat-card{
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
}
.stat-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--charcoal);}
.stat-card .lbl{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
.stat-card.highlight{background:var(--charcoal);}
.stat-card.highlight .num{color:var(--amber);}
.stat-card.highlight .lbl{color:#9BA3AC;}

/* Timeline (histórico) */
.timeline{border-left:2px solid var(--line);margin:4px 0 18px 6px;padding-left:16px;}
.timeline-item{position:relative;padding-bottom:14px;}
.timeline-item::before{
  content:"";position:absolute;left:-20.5px;top:3px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);border:2px solid var(--paper-dim);
}
.timeline-item .tl-when{font-size:11px;color:var(--gray);font-family:'IBM Plex Mono',monospace;}
.timeline-item .tl-evt{font-size:13.5px;font-weight:600;margin-top:1px;}
.timeline-item .tl-user{font-size:11.5px;color:var(--gray);margin-top:1px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-text">
      <h1>Ordens de Serviço</h1>
      <span>Ponto dos Fogões · Contagem</span>
    </div>
    <div style="display:flex;align-items:center;">
      <span class="status-dot" id="statusDot"></span>
      <span class="pill-queue" id="queuePill">0 pendente(s)</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="novo">Nova O.S.</button>
    <button class="tab-btn" data-view="dashboard">Dashboard</button>
    <button class="tab-btn" data-view="consultar">Consultar</button>
  </div>
</header>

<main>

  <!-- NOVA OS -->
  <section class="view active" id="view-novo">
    <div class="ticket">
      <div class="ticket-stub">
        <div>
          <div class="os-label">Nº da Ordem</div>
          <div class="os-num mono" id="nextOsDisplay">-----</div>
        </div>
        <div>
          <div class="os-label" style="text-align:right;">Data Entrada</div>
          <div class="os-num mono" id="dataEntradaDisplay" style="font-size:16px;"></div>
        </div>
      </div>
      <div class="ticket-body">

        <div class="field">
          <label>Cliente</label>
          <input type="text" id="f-cliente" placeholder="Nome do cliente" autocomplete="off">
        </div>

        <div class="row2">
          <div class="field">
            <label>Telefone</label>
            <input type="tel" id="f-telefone" placeholder="(31) 90000-0000">
          </div>
          <div class="field">
            <label>Setor</label>
            <select id="f-setor">
              <option value="">Selecione</option>
              <option>ELÉTRICOS</option>
              <option>PANELAS</option>
              <option>LIQUIDIFICADORES</option>
              <option>SERVIÇOS</option>
              <option>OUTROS</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>Atendente</label>
            <input type="text" id="f-atendente" placeholder="Quem está atendendo">
          </div>
          <div class="field">
            <label>Responsável Técnico</label>
            <input type="text" id="f-tecnico" placeholder="Opcional">
          </div>
        </div>

        <div class="section-title">Itens / Serviços</div>
        <div id="itemsContainer"></div>
        <button type="button" class="btn-add-item" id="btnAddItem">+ Adicionar item</button>

        <div class="row2">
          <div class="field">
            <label>Entrada / Taxa</label>
            <input type="number" step="0.01" id="f-entrada" placeholder="0,00">
          </div>
          <div class="field">
            <label>Status inicial</label>
            <input type="text" value="ABERTO" disabled style="background:#EFEAE0;color:var(--gray);font-weight:600;">
          </div>
        </div>

        <div class="section-title">Fotos da Ordem</div>
        <div class="photo-actions">
          <button type="button" id="btnCamera">📷 Câmera</button>
          <button type="button" class="secondary" id="btnGaleria">🖼 Galeria</button>
        </div>
        <input type="file" id="inputCamera" accept="image/*" capture="environment" style="display:none;">
        <input type="file" id="inputGaleria" accept="image/*" multiple style="display:none;">
        <div class="photo-grid" id="photoGrid"></div>

        <div class="totals">
          <span class="lbl">Valor Total</span>
          <span class="val" id="totalDisplay">R$ 0,00</span>
        </div>

        <button class="btn-primary" id="btnSalvar">Salvar Ordem de Serviço</button>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section class="view" id="view-dashboard">
    <div id="dashboardStats" class="stats-grid"></div>
    <div class="section-title">Ordens recentes</div>
    <div id="dashboardRecent">
      <div class="empty-state">Carregando...</div>
    </div>
  </section>

  <!-- CONSULTAR -->
  <section class="view" id="view-consultar">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Nº da O.S., cliente ou telefone" inputmode="search">
      <button id="btnSearch">Buscar</button>
    </div>
    <div id="searchResults">
      <div class="empty-state">
        <div class="big">🔍</div>
        Busque por número da O.S., cliente ou telefone
      </div>
    </div>
  </section>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-drag"></div>
    <div class="modal-close"><button id="modalCloseBtn">✕</button></div>
    <div id="modalContent" style="padding:0 16px;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const GAS_URL = "https://script.google.com/macros/s/AKfycby_wggcU36pcH45aK3kRwxx8Ce-_mqFqqrNhFsKK7huJeXILJiLLKn2DfFl4rFDDYyz1A/exec";
const MAX_ITEMS = 6;
const DB_NAME = "os_fogoes_db";
const QUEUE_KEY = "os_fogoes_queue";

// Espelha o STATUS_FLOW do Code.gs — mantenha os dois sincronizados.
const STATUS_FLOW = {
  "ABERTO": ["EM AVALIAÇÃO"],
  "EM AVALIAÇÃO": ["AGUARDANDO ORÇAMENTO", "AGUARDANDO PEÇA"],
  "AGUARDANDO ORÇAMENTO": ["AGUARDANDO APROVAÇÃO"],
  "AGUARDANDO APROVAÇÃO": ["APROVADO", "NÃO APROVADO"],
  "APROVADO": ["EM EXECUÇÃO"],
  "AGUARDANDO PEÇA": ["EM EXECUÇÃO"],
  "EM EXECUÇÃO": ["FINALIZADO", "AGUARDANDO PEÇA"],
  "FINALIZADO": ["PRONTO PARA RETIRADA"],
  "PRONTO PARA RETIRADA": ["ENTREGUE"],
  "NÃO APROVADO": ["EM AVALIAÇÃO"],
  "ENTREGUE": [],
  "CANCELADO": [],
  "DESCARTE": []
};
const TERMINAL_STATUS = ["ENTREGUE", "CANCELADO", "DESCARTE"];
function nextStatusOptions(current){
  const opts = (STATUS_FLOW[current] || []).slice();
  if (TERMINAL_STATUS.indexOf(current) === -1) {
    opts.push("CANCELADO", "DESCARTE");
  }
  return opts;
}

/* ============ STATE ============ */
let itemCount = 0;
let photos = []; // {dataUrl, id}
let nextOsNumber = null;

/* ============ UTIL ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtMoney(v){
  return "R$ " + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayBR(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+d.getFullYear();
}
function uid(){ return Date.now()+"_"+Math.random().toString(36).slice(2,8); }

/* ============ NAV ============ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'dashboard') loadDashboard();
  });
});

/* ============ ITEMS (Nova OS) ============ */
function addItemBlock(data){
  if(itemCount >= MAX_ITEMS){ toast("Máximo de 6 itens por O.S."); return; }
  itemCount++;
  const idx = itemCount;
  const wrap = document.createElement('div');
  wrap.className = 'item-block';
  wrap.dataset.idx = idx;
  wrap.innerHTML = `
    <div class="item-head">
      <span>ITEM ${String(idx).padStart(2,'0')}</span>
      <button type="button" class="rm-item">remover</button>
    </div>
    <div class="field">
      <label>Item</label>
      <input type="text" class="it-item" placeholder="Ex: Liquidificador motor e copo">
    </div>
    <div class="field">
      <label>Garantia</label>
      <div class="garantia-toggle">
        <button type="button" class="g-btn" data-v="NÃO">Não</button>
        <button type="button" class="g-btn" data-v="SIM">Sim</button>
      </div>
    </div>
    <div class="field prazo-field" style="display:none;">
      <label>Prazo de Garantia</label>
      <input type="text" class="it-prazo" placeholder="Ex: 90 dias, 6 meses, 1 ano">
    </div>
    <div class="field">
      <label>Serviço</label>
      <textarea class="it-servico" placeholder="Descrição do serviço realizado"></textarea>
    </div>
    <div class="field">
      <label>Histórico</label>
      <textarea class="it-historico" placeholder="Observações (opcional)"></textarea>
    </div>
    <div class="field" style="margin-bottom:0;">
      <label>Valor</label>
      <input type="number" step="0.01" class="it-valor" placeholder="0,00">
    </div>
  `;
  wrap.querySelector('.rm-item').addEventListener('click', ()=>{
    wrap.remove(); renumberItems(); recalcTotal();
  });
  wrap.querySelectorAll('.g-btn').forEach(gb=>{
    gb.addEventListener('click', ()=>{
      wrap.querySelectorAll('.g-btn').forEach(x=>x.classList.remove('sel-sim','sel-nao'));
      gb.classList.add(gb.dataset.v === 'SIM' ? 'sel-sim' : 'sel-nao');
      wrap.dataset.garantia = gb.dataset.v;
      wrap.querySelector('.prazo-field').style.display = gb.dataset.v === 'SIM' ? 'block' : 'none';
      if(gb.dataset.v === 'NÃO') wrap.querySelector('.it-prazo').value = '';
    });
  });
  wrap.querySelector('.it-valor').addEventListener('input', recalcTotal);
  document.getElementById('itemsContainer').appendChild(wrap);

  // default garantia = NÃO
  wrap.querySelector('.g-btn[data-v="NÃO"]').click();

  if(data){
    wrap.querySelector('.it-item').value = data.item||'';
    wrap.querySelector('.it-servico').value = data.servico||'';
    wrap.querySelector('.it-historico').value = data.historico||'';
    wrap.querySelector('.it-valor').value = data.valor||'';
    if(data.garantia === 'SIM'){
      wrap.querySelector('.g-btn[data-v="SIM"]').click();
      wrap.querySelector('.it-prazo').value = data.prazoGarantia||'';
    }
  }
}
function renumberItems(){
  itemCount = 0;
  document.querySelectorAll('#itemsContainer .item-block').forEach(el=>{
    itemCount++;
    el.dataset.idx = itemCount;
    el.querySelector('.item-head span').textContent = 'ITEM ' + String(itemCount).padStart(2,'0');
  });
}
function recalcTotal(){
  let total = 0;
  document.querySelectorAll('.it-valor').forEach(inp=>{ total += parseFloat(inp.value)||0; });
  document.getElementById('totalDisplay').textContent = fmtMoney(total);
  return total;
}
document.getElementById('btnAddItem').addEventListener('click', ()=>addItemBlock());

/* ============ PHOTOS ============ */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1280;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function renderPhotos(){
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  photos.forEach(p=>{
    const div = document.createElement('div');

}

/* ============ OFFLINE QUEUE ============ */
function getQueue(){ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); updateQueuePill(); }
function updateQueuePill(){
  const n = getQueue().length;
  const pill = document.getElementById('queuePill');
  if(n>0){ pill.style.display='inline-block'; pill.textContent = n + ' pendente' + (n>1?'s':''); }
  else{ pill.style.display='none'; }
}
async function queueOrSend(payload){
  if(navigator.onLine){
    try{
      await sendToBackend(payload);
      toast("Ordem de serviço salva!");
      return;
    }catch(e){
      console.error(e);
    }
  }
  const q = getQueue();
  q.push(payload);
  setQueue(q);
  toast("Sem conexão — salvo localmente, será enviado depois");
}
async function sendToBackend(payload){
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Erro ao salvar');
  return j;
}
async function flushQueue(){
  let q = getQueue();
  if(q.length === 0) return;
  const remaining = [];
  for(const item of q){
    try{ await sendToBackend(item); }
    catch(e){ remaining.push(item); }
  }
  setQueue(remaining);
  if(remaining.length < q.length) toast("Ordens pendentes sincronizadas");
}
window.addEventListener('online', ()=>{ setStatusDot(true); flushQueue(); });
window.addEventListener('offline', ()=>setStatusDot(false));

/* ============ SEARCH / CONSULTAR ============ */
document.getElementById('btnSearch').addEventListener('click', doSearch);

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const box = document.getElementById('searchResults');
  if(!q){ toast("Digite algo para buscar"); return; }
  box.innerHTML = '<div class="empty-state">Buscando...</div>';
  try{
    const r = await fetch(`${GAS_URL}?action=search&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    if(!j.results || j.results.length===0){
      box.innerHTML = '<div class="empty-state"><div class="big">📭</div>Nenhuma ordem encontrada</div>';
      return;
    }
    box.innerHTML = '';
    j.results.forEach(res=>{
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-left">
          <div class="os">O.S. ${res.os}</div>
          <div class="cli">${res.cliente || '(sem nome)'}</div>
          <div class="meta">${res.data || ''} · ${res.setor || ''}</div>
        </div>
        ${badgeHtml(res.status)}
      `;
      card.addEventListener('click', ()=>openDetail(res.os));
      box.appendChild(card);
    });
  }catch(e){
    box.innerHTML = '<div class="empty-state">Sem conexão. Tente novamente quando estiver online.</div>';
  }
}
function badgeHtml(status){
  status = (status||'').toUpperCase();
  let cls = 'aberto';
  if(status.includes('ENTREGUE')) cls='entregue';
  else if(status.includes('CANCEL')||status.includes('NÃO APROVADO')||status.includes('DESCARTE')) cls='pendente';
  else if(status.includes('AGUARDANDO')) cls='aguardando';
  else if(status.includes('EXECUÇÃO')||status.includes('APROVADO')||status.includes('AVALIAÇÃO')||status.includes('FINALIZADO')||status.includes('PRONTO')) cls='execucao';
  return `<span class="badge ${cls}">${status||'ABERTO'}</span>`;
}

/* ============ DASHBOARD ============ */
async function loadDashboard(){
  const statsBox = document.getElementById('dashboardStats');
  const recentBox = document.getElementById('dashboardRecent');
  statsBox.innerHTML = '<div class="empty-state">Carregando...</div>';
  recentBox.innerHTML = '';
  try{
    const r = await fetch(`${GAS_URL}?action=dashboard`);
    const j = await r.json();
    const counts = j.counts || {};
    const order = ["ABERTO","EM AVALIAÇÃO","AGUARDANDO ORÇAMENTO","AGUARDANDO APROVAÇÃO","APROVADO",
      "AGUARDANDO PEÇA","EM EXECUÇÃO","FINALIZADO","PRONTO PARA RETIRADA","ENTREGUE","NÃO APROVADO","CANCELADO","DESCARTE"];
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    let html = `<div class="stat-card highlight"><div class="num">${total}</div><div class="lbl">O.S. no total</div></div>`;
    order.forEach(s=>{
      if(!counts[s]) return;
      html += `<div class="stat-card"><div class="num">${counts[s]}</div><div class="lbl">${s}</div></div>`;
    });
    statsBox.innerHTML = html;

    if(!j.recent || j.recent.length===0){
      recentBox.innerHTML = '<div class="empty-state">Nenhuma O.S. cadastrada ainda</div>';
      return;
    }
    recentBox.innerHTML = '';
    j.recent.forEach(res=>{
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-left">
          <div class="os">O.S. ${res.os}</div>
          <div class="cli">${res.cliente || '(sem nome)'}</div>
          <div class="meta">${res.data || ''}</div>
        </div>
        ${badgeHtml(res.status)}
      `;
      card.addEventListener('click', ()=>openDetail(res.os));
      recentBox.appendChild(card);
    });
  }catch(e){
    statsBox.innerHTML = '<div class="empty-state">Sem conexão para carregar o dashboard.</div>';
  }
}

/* ============ DETAIL / EDIT MODAL ============ */
let currentDetail = null;
let currentHistory = [];
async function openDetail(os){
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = '<div class="empty-state">Carregando...</div>';
  overlay.classList.add('active');
  try{
    const [detailRes, histRes] = await Promise.all([
      fetch(`${GAS_URL}?action=get&os=${encodeURIComponent(os)}`),
      fetch(`${GAS_URL}?action=history&os=${encodeURIComponent(os)}`)
    ]);
    const j = await detailRes.json();
    const h = await histRes.json();
    if(!j.ok){ content.innerHTML = '<div class="empty-state">Ordem não encontrada</div>'; return; }
    currentDetail = j.data;
    currentHistory = (h.ok && h.events) ? h.events : [];
    renderDetail();
  }catch(e){
    content.innerHTML = '<div class="empty-state">Sem conexão para carregar detalhes.</div>';
  }
}

      <div class="field"><label>Item</label><div>${it.item||'-'}</div></div>
      <div class="field"><label>Serviço</label><div>${it.servico||'-'}</div></div>
      <div class="field"><label>Valor</label><div class="mono">${fmtMoney(it.valor||0)}</div></div>
    </div>
  `).join('');

  const photosHtml = (d.fotos||[]).map(url=>`
    <div class="photo-thumb"><img src="${url}"></div>
  `).join('');

  content.innerHTML = `
    <h2 class="mono" style="margin-bottom:2px;">O.S. ${d.os}</h2>
    <div class="hint" style="margin-top:2px;">${d.cliente} · ${d.telefone||''}</div>

    <div class="section-title">Status atual: ${d.status || 'ABERTO'}</div>

      <option value="${d.status}">${d.status} (manter)</option>
      ${nextStatusOptions(d.status).map(s=>`<option value="${s}">${s}</option>`).join('')}

    <div class="field">
      <label>Responsável pela alteração</label>
      <input type="text" id="edit-usuario" placeholder="Seu nome">
    </div>

    <div class="section-title">Itens (${(d.items||[]).length}/6)</div>
    ${itemsHtml || '<div class="hint">Nenhum item cadastrado</div>'}
    ${(d.items||[]).length < 6 ? '<button type="button" class="btn-add-item" id="btnAddItemEdit">+ Adicionar novo item</button>' : ''}
    <div id="newItemEditWrap"></div>

    <div class="section-title">Fotos</div>
    <div class="photo-actions">
      <button type="button" id="btnCameraEdit">📷 Câmera</button>
      <button type="button" class="secondary" id="btnGaleriaEdit">🖼 Galeria</button>
    </div>
    <input type="file" id="inputCameraEdit" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="inputGaleriaEdit" accept="image/*" multiple style="display:none;">
    <div class="photo-grid">${photosHtml}</div>
    <div class="photo-grid" id="newPhotoGridEdit"></div>

    <div class="totals" style="margin-top:16px;">
      <span class="lbl">Valor Total</span>
      <span class="val mono">${fmtMoney(d.valorTotal||0)}</span>
    </div>

    <button class="btn-primary" id="btnSaveEdit">Salvar alterações</button>

    <div class="section-title">Histórico</div>
    <div class="timeline">
      ${currentHistory.length===0 ? '<div class="hint">Sem movimentações registradas ainda</div>' :
        currentHistory.map(ev => `
          <div class="timeline-item">
            <div class="tl-when">${ev.dataHora}</div>
            <div class="tl-evt">${ev.evento}${ev.statusNovo ? ' → ' + ev.statusNovo : ''}</div>
            ${ev.usuario ? `<div class="tl-user">${ev.usuario}</div>` : ''}
          </div>
        `).join('')}
    </div>
  `;

  let newPhotosEdit = [];
  let newItemData = null;

  const btnAdd = document.getElementById('btnAddItemEdit');
  if(btnAdd){
    btnAdd.addEventListener('click', ()=>{
      btnAdd.style.display='none';
      const wrap = document.getElementById('newItemEditWrap');
      wrap.innerHTML = `
        <div class="item-block">
          <div class="item-head"><span>NOVO ITEM</span></div>
          <div class="field"><label>Item</label><input type="text" id="ni-item"></div>
          <div class="field"><label>Garantia</label>
            <div class="garantia-toggle">
              <button type="button" class="g-btn" data-v="NÃO">Não</button>
              <button type="button" class="g-btn" data-v="SIM">Sim</button>
            </div>
          </div>

            <label>Prazo de Garantia</label>

          </div>
